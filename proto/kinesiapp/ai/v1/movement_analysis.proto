syntax = "proto3";

package kinesiapp.ai.v1;

import "kinesiapp/common/v1/movement.proto";

// Servicio de IA: solo lo llama el backend. Está expuesto detrás de Envoy con gRPC-Web, porque en el plan
// free de Render un servicio no recibe tráfico privado, y solo acepta llamadas con el secreto compartido
// en "authorization: Bearer <secreto>". Sin él responde UNAUTHORIZED (UNAUTHENTICATED). No lleva token de
// usuario, así que la opción access no aplica a este paquete.
// La salud del proceso la expongo con el estándar grpc.health.v1.Health.

// Video → pose (YOLO + MediaPipe) → ángulos → repeticiones → riesgo.
service MovementAnalysisService {
  // Server streaming porque el análisis tarda decenas de segundos: el backend reenvía el progreso a
  // AnalysisService.WatchAnalysis. Los errores cierran el stream con su status code:
  //   - BAD_REQUEST (INVALID_ARGUMENT): URL que no es https, de un host no permitido o que redirige a otro.
  //   - AI_BUSY (RESOURCE_EXHAUSTED): ya corre el máximo de análisis simultáneos.
  //   - STORAGE_UNAVAILABLE (UNAVAILABLE): la descarga falló o pasó su tiempo máximo.
  //   - VIDEO_TOO_LARGE, VIDEO_UNREADABLE y VIDEO_TOO_LONG (INVALID_ARGUMENT).
  //   - NO_MOVEMENT_DETECTED (FAILED_PRECONDITION).
  rpc AnalyzeVideo(AnalyzeVideoRequest) returns (stream AnalyzeVideoResponse);
}

message AnalyzeVideoRequest {
  // URL firmada de lectura del video en el bucket. Le paso una URL y no los bytes para no cargar el video
  // completo en un mensaje gRPC. Solo la descargo si su host está en la lista permitida de la IA.
  string video_url = 1;
  kinesiapp.common.v1.MovementType movement_type = 2;
}

message AnalyzeVideoResponse {
  oneof event {
    kinesiapp.common.v1.AnalysisProgress progress = 1;
    // Siempre el último mensaje del stream.
    MovementAnalysisResult result = 2;
  }
}

message MovementAnalysisResult {
  kinesiapp.common.v1.RiskAssessment risk_assessment = 1;
  repeated kinesiapp.common.v1.JointAngleSample angle_samples = 2;
  // Duración real del archivo, medida aquí y no la que declaró el navegador.
  int32 duration_ms = 3;
  string pose_model_version = 4;
  string risk_model_version = 5;
}
