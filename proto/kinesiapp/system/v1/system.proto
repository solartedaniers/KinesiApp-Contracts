syntax = "proto3";

package kinesiapp.system.v1;

import "google/protobuf/timestamp.proto";
import "kinesiapp/common/v1/ai_state.proto";
import "kinesiapp/common/v1/identity.proto";

// Servicio técnico del backend. Lo uso para comprobar de punta a punta que el transporte
// (Next.js → gRPC-Web → Envoy → grpcio) funciona antes de montar los servicios de dominio.
service SystemService {
  // Devuelvo el mismo mensaje que recibo, con la hora del servidor.
  rpc Ping(PingRequest) returns (PingResponse) {
    option (kinesiapp.common.v1.access) = {public: true};
  }

  // Los límites y reglas que el cliente valida antes de enviar, con los mismos valores que aplico en el
  // servidor. Así el frontend no los repite en su código. Es igual para todos y se puede cachear.
  rpc GetClientPolicy(GetClientPolicyRequest) returns (GetClientPolicyResponse) {
    option (kinesiapp.common.v1.access) = {public: true};
  }

  // El frontend lo llama al iniciar sesión para despertar la IA y mostrar "IA despertando" o "IA activada".
  // Si la IA no responde, devuelvo UNAVAILABLE con reason AI_UNAVAILABLE.
  rpc WakeUpAi(WakeUpAiRequest) returns (WakeUpAiResponse);
}

message PingRequest {
  // Texto libre que devuelvo tal cual.
  string message = 1;
}

message PingResponse {
  // El mismo texto de PingRequest.message.
  string message = 1;
  // Momento en que atendí la llamada.
  google.protobuf.Timestamp server_time = 2;
}

message GetClientPolicyRequest {}

message GetClientPolicyResponse {
  // Versión vigente del texto de consentimiento de video: la que exigen el registro y la subida.
  int32 video_consent_version = 1;
  VideoPolicy video = 2;
  int64 max_avatar_size_bytes = 3;
  PasswordPolicy password = 4;
  // Rango de edad admitido para la ficha de un deportista.
  int32 athlete_min_age_years = 5;
  int32 athlete_max_age_years = 6;
  int32 chat_message_max_chars = 7;
  BiometricsPolicy biometrics = 8;
  RiskScalePolicy risk_scale = 9;
}

// Cortes de nivel de riesgo sobre un risk_score de 0 a 1: desde moderate_from es moderado y desde
// high_from es alto. Cada análisis ya trae su RiskLevel; estos cortes son para lo que el cliente
// calcula por su cuenta, como promedios, la peor repetición o las bandas de un medidor.
message RiskScalePolicy {
  double moderate_from = 1;
  double high_from = 2;
}

// Rangos realistas de la ficha física: atrapan unidades equivocadas (una estatura en metros, un peso en
// libras) antes de que deformen las métricas. Los extremos son inclusivos.
message BiometricsPolicy {
  double min_height_cm = 1;
  double max_height_cm = 2;
  double min_weight_kg = 3;
  double max_weight_kg = 4;
}

message VideoPolicy {
  // El límite de 40 s.
  int32 max_duration_seconds = 1;
  int64 max_size_bytes = 2;
}

enum PasswordRequirement {
  PASSWORD_REQUIREMENT_UNSPECIFIED = 0;
  PASSWORD_REQUIREMENT_UPPERCASE = 1;
  PASSWORD_REQUIREMENT_LOWERCASE = 2;
  PASSWORD_REQUIREMENT_DIGIT = 3;
  PASSWORD_REQUIREMENT_SPECIAL_CHARACTER = 4;
}

// Política de contraseñas nuevas (registro, recuperación y cambio).
message PasswordPolicy {
  int32 min_length = 1;
  int32 max_length = 2;
  // Cada clase de caracter debe aparecer al menos una vez, en el orden en que informo las que faltan.
  repeated PasswordRequirement requirements = 3;
}

message WakeUpAiRequest {}

message WakeUpAiResponse {
  kinesiapp.common.v1.AiState state = 1;
}
