syntax = "proto3";

package kinesiapp.common.v1;

// Tipos del análisis de movimiento que comparten el dominio de análisis (lo que ve el usuario) y el de
// IA (lo que calcula el modelo). Los dejo aquí para que el resultado viaje igual de la IA al frontend
// sin que un dominio importe al otro.

enum MovementType {
  MOVEMENT_TYPE_UNSPECIFIED = 0;
  MOVEMENT_TYPE_JUMP = 1;
  MOVEMENT_TYPE_SQUAT = 2;
}

enum AnalysisStatus {
  ANALYSIS_STATUS_UNSPECIFIED = 0;
  // Video subido y en cola o en proceso.
  ANALYSIS_STATUS_PENDING = 1;
  ANALYSIS_STATUS_PROCESSED = 2;
  ANALYSIS_STATUS_FAILED = 3;
}

// Etapa del procesamiento, para mostrar el progreso mientras corre el análisis.
enum AnalysisStage {
  ANALYSIS_STAGE_UNSPECIFIED = 0;
  ANALYSIS_STAGE_QUEUED = 1;
  ANALYSIS_STAGE_DOWNLOADING_VIDEO = 2;
  // La etapa larga: YOLO y MediaPipe frame por frame. Es la única con frames_processed/frames_total.
  ANALYSIS_STAGE_EXTRACTING_POSE = 3;
  ANALYSIS_STAGE_DETECTING_REPETITIONS = 4;
  ANALYSIS_STAGE_SCORING_RISK = 5;
}

message AnalysisProgress {
  AnalysisStage stage = 1;
  int32 frames_processed = 2;
  // 0 mientras no se conoce.
  int32 frames_total = 3;
}

// Nivel según los cortes del modelo de riesgo. Lo calculo en el servidor para que el frontend no
// replique los umbrales.
enum RiskLevel {
  RISK_LEVEL_UNSPECIFIED = 0;
  RISK_LEVEL_LOW = 1;
  RISK_LEVEL_MODERATE = 2;
  RISK_LEVEL_HIGH = 3;
}

enum JointAngle {
  JOINT_ANGLE_UNSPECIFIED = 0;
  JOINT_ANGLE_KNEE_FLEXION = 1;
  JOINT_ANGLE_TRUNK_INCLINATION = 2;
  // Ángulo de proyección en el plano frontal (FPPA) entre muslo y pierna. Positivo: la rodilla se va
  // hacia adentro (valgo); negativo: hacia afuera. Solo se mide con la cámara de frente.
  JOINT_ANGLE_KNEE_VALGUS = 3;
}

// Lado del cuerpo del deportista, no de la imagen.
enum BodySide {
  BODY_SIDE_UNSPECIFIED = 0;
  BODY_SIDE_LEFT = 1;
  BODY_SIDE_RIGHT = 2;
}

// Desde dónde grabó la cámara. Lo detecta la IA con la pose; el usuario no lo declara.
enum CameraView {
  // Análisis anteriores a la detección: todos se analizaron como de lado.
  CAMERA_VIEW_UNSPECIFIED = 0;
  // Se mide la flexión de rodilla y la inclinación del tronco.
  CAMERA_VIEW_SIDE = 1;
  // Se mide el valgo de cada rodilla.
  CAMERA_VIEW_FRONT = 2;
  // Diagonal o dudosa: mido lo de la vista lateral y aviso que el valgo no se midió.
  CAMERA_VIEW_INCONCLUSIVE = 3;
}

// Avisos sobre la calidad del análisis; el texto lo pone el frontend.
enum AnalysisWarning {
  ANALYSIS_WARNING_UNSPECIFIED = 0;
  // La vista no fue claramente lateral ni frontal: los ángulos son aproximados y el valgo no se midió.
  ANALYSIS_WARNING_CAMERA_VIEW_INCONCLUSIVE = 1;
}

message JointAngleSample {
  JointAngle joint = 1;
  double angle_degrees = 2;
  // Milisegundos desde el inicio del video.
  int32 frame_timestamp_ms = 3;
  // Solo en las articulaciones que se miden por pierna (el valgo).
  BodySide side = 4;
}

// Puntos del cuerpo que viajan en los fotogramas clave.
enum BodyLandmark {
  BODY_LANDMARK_UNSPECIFIED = 0;
  BODY_LANDMARK_LEFT_SHOULDER = 1;
  BODY_LANDMARK_RIGHT_SHOULDER = 2;
  BODY_LANDMARK_LEFT_HIP = 3;
  BODY_LANDMARK_RIGHT_HIP = 4;
  BODY_LANDMARK_LEFT_KNEE = 5;
  BODY_LANDMARK_RIGHT_KNEE = 6;
  BODY_LANDMARK_LEFT_ANKLE = 7;
  BODY_LANDMARK_RIGHT_ANKLE = 8;
  BODY_LANDMARK_LEFT_HEEL = 9;
  BODY_LANDMARK_RIGHT_HEEL = 10;
  BODY_LANDMARK_LEFT_FOOT_INDEX = 11;
  BODY_LANDMARK_RIGHT_FOOT_INDEX = 12;
}

message Keypoint {
  BodyLandmark landmark = 1;
  // Coordenadas normalizadas al cuadro del video (0 a 1); y crece hacia abajo.
  double x = 2;
  double y = 3;
}

// La pose en el instante de un pico de riesgo, para dibujar el esqueleto sobre el video.
message PoseKeyframe {
  int32 timestamp_ms = 1;
  repeated Keypoint keypoints = 2;
}

// Cómo se encontró una repetición dentro del video.
enum DetectionMethod {
  DETECTION_METHOD_UNSPECIFIED = 0;
  DETECTION_METHOD_LANDING = 1;
  DETECTION_METHOD_KNEE_BOTTOM = 2;
  DETECTION_METHOD_TRUNK_HINGE = 3;
  // Punto más bajo de la cadera: la sentadilla vista de frente, donde la flexión de rodilla no se mide.
  DETECTION_METHOD_HIP_BOTTOM = 4;
}

enum RiskDirection {
  RISK_DIRECTION_UNSPECIFIED = 0;
  RISK_DIRECTION_HIGHER_IS_RISKIER = 1;
  RISK_DIRECTION_LOWER_IS_RISKIER = 2;
}

// Rango de un ángulo; un extremo ausente significa que el modelo no pone límite de ese lado.
message AngleRange {
  optional double low_degrees = 1;
  optional double high_degrees = 2;
}

message AngleSummary {
  double median_degrees = 1;
  double min_degrees = 2;
  double max_degrees = 3;
}

// Una señal de riesgo (por ejemplo "knee_rigid") con la rampa que la puntúa.
message RiskSignal {
  // Código configurable de la señal; no lo hago enum porque los patrones salen de la configuración del modelo.
  string code = 1;
  JointAngle joint = 2;
  RiskDirection direction = 3;
  double onset_degrees = 4;
  double saturation_degrees = 5;
  // Ausente si el ángulo no se pudo medir en ninguna repetición.
  optional AngleSummary measured = 6;
  optional double score_median = 7;
  // Pierna medida: la del valgo o, de lado, la más visible para la cámara. Sin lado en el tronco.
  BodySide side = 8;
}

message RiskPattern {
  // Código configurable del patrón, por ejemplo "rigid_landing".
  string code = 1;
  optional double score = 2;
  int32 repetitions_triggered = 3;
  repeated RiskSignal signals = 4;
}

message RepetitionScore {
  string code = 1;
  // Ausente si no se pudo calcular (ángulo no medido).
  optional double score = 2;
  optional double measured_degrees = 3;
  // Solo en las señales: la pierna medida y el instante del pico dentro de la repetición, que apunta a
  // uno de los keyframes de la repetición.
  BodySide side = 4;
  optional int32 peak_ms = 5;
}

message Repetition {
  int32 start_ms = 1;
  int32 end_ms = 2;
  DetectionMethod detected_by = 3;
  // Puntaje de cada patrón en esta repetición.
  repeated RepetitionScore pattern_scores = 4;
  // Puntaje y ángulo de cada señal en esta repetición.
  repeated RepetitionScore signal_scores = 5;
  // La pose en cada instante de pico de las señales, sin repetir instantes.
  repeated PoseKeyframe keyframes = 6;
}

// Resultado completo del modelo de riesgo.
message RiskAssessment {
  // De 0 a 1.
  double risk_score = 1;
  RiskLevel risk_level = 2;
  // Ausente cuando ningún patrón se disparó.
  optional string dominant_pattern = 3;
  repeated RiskPattern patterns = 4;
  repeated Repetition repetitions = 5;
  CameraView camera_view = 6;
  repeated AnalysisWarning warnings = 7;
}
