syntax = "proto3";

package kinesiapp.common.v1;

// Fecha de calendario sin hora ni zona. La uso para la fecha de nacimiento, que con un Timestamp
// cambiaría de día según la zona horaria. Tiene la misma forma que google.type.Date sin depender de googleapis.
message CalendarDate {
  int32 year = 1;
  // De 1 a 12.
  int32 month = 2;
  // De 1 a 31.
  int32 day = 3;
}
